<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Polyfill localStorage before any modules load.
         Some browsers block storage access (strict privacy settings),
         which causes the Base44 SDK to crash before React mounts. -->
    <script>
      (function () {
        var blocked = false;
        try { window.localStorage; } catch (e) { blocked = true; }
        if (blocked) {
          var _d = {};
          var _mem = {
            getItem:    function (k) { return Object.prototype.hasOwnProperty.call(_d, k) ? _d[k] : null; },
            setItem:    function (k, v) { _d[k] = String(v); },
            removeItem: function (k) { delete _d[k]; },
            clear:      function ()    { _d = {}; },
            key:        function (i)   { return Object.keys(_d)[i] || null; }
          };
          Object.defineProperty(_mem, 'length', { get: function () { return Object.keys(_d).length; } });
          try {
            Object.defineProperty(window, 'localStorage', { get: function () { return _mem; }, configurable: true });
          } catch (e2) { /* browser won't allow override */ }
        }
      }());
    </script>
    <link rel="icon" type="image/png" href="/src/assets/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CFDE Connect</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
